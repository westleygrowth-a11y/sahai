services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run setup:local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:local}
      POSTGRES_DB: ${POSTGRES_DB:-sahai}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - sahai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  sahai_postgres:
